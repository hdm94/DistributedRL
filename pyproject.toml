[project]
name = "distributedrl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "hydra-core>=1.3.7",
    "python-dotenv>=1.2.4",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "wandb>=0.31.0",
]

[project.scripts]
distributedrl = "distributedrl:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
