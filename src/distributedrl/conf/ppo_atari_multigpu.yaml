# Hydra config for ppo_atari_multigpu.py. Values here override the `Args` defaults.
# Pick a game with game=breakout|seaquest and hardware with machine=local|runpod. Override from the CLI, e.g.:  torchrun --standalone --nproc_per_node=2 ppo_atari_multigpu.py track=true
defaults:
  - base_ppo_atari_multigpu
  - game: seaquest
  - model: nature_cnn
  - machine: local
  - _self_

wandb_entity: null  # placeholder: set your wandb team/user, or leave null
reward: custom  # raw | custom (see wrappers/rewards.py)
game_stats: true  # log game/* per-episode Seaquest stats
ram_info: false  # true: expose emulator RAM in info and log ram/* (oxygen, depth, ...)

hydra:
  run:
    dir: ${log_dir}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${log_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
